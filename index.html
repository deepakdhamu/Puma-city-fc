<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Puma City FC — Official Club Website">

    <title>Puma City FC | Official Website</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="site">

    <!-- HEADER -->
    <header class="header">

        <div class="brand" onclick="openPage('home')">

            <div class="crest">
                <img src="Club-logo.png">
            </div>

            <div class="brand-text">
                <strong>PUMA CITY FC</strong>
                <span>AURAVIA LEGEND LEAGUE</span>
            </div>

        </div>

        <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <!-- MENU -->
    <div class="menu-overlay" id="menuOverlay">

        <div class="menu-inner">

            <div class="menu-top">
                <span>MENU</span>
                <button onclick="toggleMenu()">×</button>
            </div>

            <nav class="menu-links">

                <button onclick="openPage('home')">
                    <b>01</b>
                    HOME
                    <span>→</span>
                </button>

                <button onclick="openPage('squad')">
                    <b>02</b>
                    SQUAD
                    <span>→</span>
                </button>

                <button onclick="openPage('fixtures')">
                    <b>03</b>
                    FIXTURES
                    <span>→</span>
                </button>

                <button onclick="openPage('news')">
                    <b>04</b>
                    NEWS
                    <span>→</span>
                </button>

                <button onclick="openPage('shop')">
                    <b>05</b>
                    CLUB SHOP
                    <span>→</span>
                </button>

                <button onclick="openPage('about')">
                    <b>06</b>
                    ABOUT THE CLUB
                    <span>→</span>
                </button>

            </nav>

        </div>

    </div>


    <!-- MAIN -->
    <main id="app"></main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <button class="nav-item active" onclick="openPage('home')">
            <span>⌂</span>
            <small>HOME</small>
        </button>

        <button class="nav-item" onclick="openPage('squad')">
            <span>♙</span>
            <small>SQUAD</small>
        </button>

        <button class="nav-item" onclick="openPage('fixtures')">
            <span>▦</span>
            <small>FIXTURES</small>
        </button>

        <button class="nav-item" onclick="openPage('shop')">
            <span>▢</span>
            <small>SHOP</small>
        </button>

        <button class="nav-item" onclick="toggleMenu()">
            <span>•••</span>
            <small>MORE</small>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
